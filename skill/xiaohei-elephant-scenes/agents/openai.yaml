interface:
  display_name: "小黑象 2.0 真实物品场景图"
  short_description: "先理解段落，再生成真实物品小现场、3:4 小红书手绘信息图、3:4 V3 真人封面、21:9 Cover、9:16 扇面封面或彩蛋长卷"
  default_prompt: |
    Use $xiaohei-elephant-scenes for this request.

    3:4 小红书封面路由：只有用户明确说小红书封面、3:4 封面或 V3 真人封面，才读取 references/xhs-cover-v3-real-person-contract.md；必须分别登记 V3 成品封面、人物身份图和单一动作图，不能把 V3 成品直接裁切或当底图。

    Follow `SKILL.md` as the single orchestration contract:
    1. 先路由模式：标准 16:9 正文图、3:4 小红书手绘信息图、21:9 Cover、9:16 视频封面/扇面内容，或 2.6:1—3:1 彩蛋长卷。只有用户同时明确“小黑象 + 小红书/3:4/信息图”才进入 3:4 分支；未明确封面、3:4 小红书、视频封面或长卷时，默认标准正文图。
    2. 先读完整文章段落，不只摘标题或主题词；为每张图写 shot record，至少包含主旨、处境/输入、段落类型、独立信息节点、结果/边界、视觉关系、主物品、辅助单元及语义职责、核心动作、密度档位、短标签和 3 秒读懂句。缺失事实写“未获取”，不补造。
    3. 标准正文按 `references/style-dna.md` 选择 D1/D2/D3；3:4 小红书分支按 `references/xhs-infographic-3x4-runtime-contract.md` 选择 3-6 个段落节点和一个手绘版式关系。标准图必须用真实物品物理链；3:4 分支可以用少量手绘区域、气泡、图标和关系线，但不做 UI、仪表盘或密集节点墙。
    4. 最终 Prompt 只使用 `references/prompt-template.md`。标准图先放尺度补偿锁，再折入 `references/xiaohei-elephant-ip-lock.md`；3:4 小红书分支额外读取 `xhs-infographic-3x4-runtime-contract.md`，保留扇面内容语言但禁止实体折扇。所有模式的小黑象保持短象鼻、小耳朵、白点眼、四足短圆桩腿和轻巧小比例；明确点名飞书、Codex、OpenAI 等产品时才使用对应官方 logo，且 logo 要小、准、贴在具体物件或信息单元上。
    5. 同文章多图先过第 1 张 QA，再冻结唯一角色母版。母版冻结是唯一 barrier；之后 02/03/04 等独立 job 默认并行启动最多 3 个 `codex exec`，每个只引用同一母版并写独立输出/Prompt/QA，限流时降低并发或排队，不串联引用上一张成图。
    6. 标准正文图先过 shot record 的段落语义/密度门，再由 Codex 当前 GPT 系列运行时的原生视觉理解做一次 IP、尺度和文字白名单 QA；不要把 GLM-4.6V 当作 Codex 视觉模型。只有运行于 Hermes/智谱外部 API 通道时，才调用 `scripts/qa_image.py` 这个 Zhipu/GLM 适配器。3:4 小红书、Cover、9:16 和长卷继续走各自全量 QA，不得用轻量检查替代。
    7. Cover/9:16 额外执行 `references/cover-typography-runtime-contract.md`：单个候选一次 `image_gen`，整个 Cover 最多 8 个候选；P0 安全区/强制文案优先于 P1 可读性/内容，再优先于 P2 装饰审美，8 版未收敛就 `NEEDS_HUMAN`，禁止第 9 版和独立文字层。扇面分支只生成平面内容画布，品牌锚点只能有一个，不生成实体折扇。3:4 小红书按 `references/xhs-infographic-3x4-runtime-contract.md` 和 `templates/xhs-infographic-3x4-receipt.md` 执行单卡一次成型、逐字白名单和 8 版熔断。
    8. 生成后按 `references/qa-checklist.md` 验收；Critical 失败不交付、不继续批量生图。图片与 prompt 归档到 `/Users/dx/Hermes-agent/21-配图空间/<文章或项目名>/`。

    路由边界：普通“小黑象配图/正文配图”默认使用本 Skill 的 2.0；只有明确要求“白底手绘/低科技手绘隐喻/手绘解释图/1.0”才使用 `$xiaohei-elephant-illustrations`。旧版 `$xiaohei-scenes` 只作源码参考。
policy:
  allow_implicit_invocation: true

required_references:
  - references/xiaohei-elephant-ip-lock.md
  - references/style-dna.md
  - references/prompt-template.md
  - references/fan-cover-reference-analysis.md
  - references/xhs-infographic-3x4-runtime-contract.md
  - references/xhs-cover-v3-real-person-contract.md
  - references/cover-typography-runtime-contract.md
  - references/object-patterns.md
  - references/qa-checklist.md
  - references/scale-calibration.md
  - references/article-batch-character-lock.md
  - scripts/qa_image.py
  - templates/cover-typography-receipt.md
  - templates/xhs-infographic-3x4-receipt.md
  - templates/xhs-cover-v3-real-person-receipt.md
  - GOTCHAS.md

routing:
  accepts:
    - "小黑象"
    - "小黑象配图"
    - "小黑象正文配图"
    - "小黑象 2.0"
    - "小黑象真实物品"
    - "小黑象真实物件"
    - "真实物品 + 物理动作"
    - "小黑象场景图"
    - "实物小现场"
    - "小黑象 2.0 cover"
    - "小黑象 2.0 9:16 视频封面"
    - "小黑象小红书图文"
    - "小黑象小红书信息图"
    - "小黑象小红书封面"
    - "小黑象 3:4 卡片"
    - "小黑象 3:4 封面"
    - "小黑象知识卡片"
    - "V3 真人封面"
    - "扇面内容视频封面"
    - "扇面内容封面"
    - "折扇扇面视频封面（兼容旧触发词，默认只取扇面内容）"
    - "文稿确认后生成视频封面"
    - "小黑象彩蛋长卷"
  redirects:
    xiaohei-elephant-illustrations: "明确的 1.0 白底手绘解释图或低科技手绘隐喻"
    xiaohei-scenes: "旧版小黑源码参考；不承接小黑象请求"

quality_gate:
  critical_rejects:
    - "角色缺少短象鼻、小耳朵、白点眼或四足短圆桩腿"
    - "出现小黑人、旧小黑、黑色人形、火柴腿、二足站姿、膝盖、脚掌或鞋子"
    - "标准图超过 3%-5% 或 Cover 超过 4%-6% 画面高，或角色变成笨重 3D 玩具/商品模型/近景主角"
    - "标准图没有真实物品、核心物理动作或输入 -> 机制 -> 结果/边界的可见关系"
    - "解释型段落固定压成 D1，或辅助物件没有独立信息职责"
    - "标准真实物品、Cover、9:16 或长卷物品孤立排队、标签替代节点、画面变成 PPT/UI/节点墙/复杂信息图；3:4 小红书分支仍不得变成 UI、仪表盘或密集节点墙"
    - "未点名品牌却猜 logo，或 logo 错误、漂浮、过大、山寨化或抢主视觉"
    - "同文章多图没有唯一角色母版，或同模式尺度相对母版漂移超过 ±10%"
    - "Cover 缺主题/标题/金句/具体图解、后期叠字、禁用中间产物、回执缺失或视觉 QA 不可用"
    - "9:16 直接裁切横版、没有平台安全区，或扇面分支出现实体折扇/缺品牌锚点/混入多张参考母版"
    - "3:4 小红书未使用暖奶油纸面、缺少 3-6 个段落节点、出现实体折扇、多页拼图、文字不在白名单或小黑象超过 3%-5%"
    - "3:4 小红书 V3 真人封面未登记三类参考、直接裁切 V3 成品、人物身份或动作漂移、缺白描边、黑底黑象不可见或后期叠字"
