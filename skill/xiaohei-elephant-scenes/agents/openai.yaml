interface:
  display_name: "小黑象 2.0 真实物品场景图"
  short_description: "生成小黑象 2.0 的真实物品小现场、21:9 cover、9:16 扇面内容型视频封面和彩蛋长卷"
  default_prompt: |
    Use $xiaohei-elephant-scenes for this request.

    默认调用链：
    1. 先判断模式：标准 16:9 正文图、21:9 cover、9:16 视频封面分支（含扇面内容视觉变体）、或彩蛋长卷；用户未明确说 cover/视频封面/长卷时默认标准图。
    2. 必须读取并执行这些共享约束：
       - references/xiaohei-elephant-ip-lock.md：复制或等价包含 Xiaohei Elephant 2.0 IP lock，尤其是短象鼻、小耳朵、白点眼、四足短圆桩腿、禁止二足/人形腿，以及标准图 3%-5% / cover 4%-6% 的小黑象占比硬上限。
       - references/style-dna.md：锁定原版小黑 2.0 质感，包括镜头后退、真实物品少而准、小黑象黑色视觉体量约为此前测试的 1/3、轻接触阴影、手写短标签、颜色只做小点缀。
       - references/prompt-template.md：按对应模式组织最终生图 prompt，不临时手写一套平行模板。
       - references/fan-cover-reference-analysis.md：如果是扇面参考图，按其中的平面内容不变量、变量边界和“未获取”口径执行；不要把参考图的实体折扇当成输出主体。
       - references/cover-typography-runtime-contract.md：Cover 字体唯一来源、一次成型、禁用 base/overlay 血缘、视觉 QA 阻断和字体运行回执。
       - references/object-patterns.md：标准真实物品模式先选物理动作，再选真实主物品；扇面内容分支改用平面版式关系，小黑象与标题、气泡、图标或下划线建立清晰视觉关系。
       - references/qa-checklist.md：生成或交付前做 QA，Critical 任一失败就重写 prompt 或重生成。
       - references/scale-calibration.md：标准图把尺度补偿块放在 Prompt 前 8 行；首张以 1.5%-2.5% 为模型目标、以实际 3%-5% 为验收，并按 A/B/C 档重试。
       - references/article-batch-character-lock.md：同一文章有 2 张及以上图片时，首张过 QA 后冻结为唯一角色母版；后续每张直接引用母版，同模式尺度相对母版偏差不超过 ±10%，禁止串联引用上一张。
       - GOTCHAS.md：重点避开旧小黑/小黑人、3D 玩具小象、商品棚拍、close-up、标题化标签和物品堆叠。
    3. 输出 shot list 时必须包含：主题、原始段落/小节正文、段落主旨/一句话结论、段落类型、读者处境、输入/起始状态、核心冲突句、独立信息节点、必须看见的节点及其视觉承载方式、密度档位 D1/D2/D3 及选择依据、结果/判断/边界、视觉关系类型、可见信息链、真实主物品或平面扇面内容画布、按密度档位填写的辅助物品/状态单元及各自语义职责或批注/图标/印章职责、核心物理动作或版式关系、小黑象动作/平面关系、小黑象腿部锁定、小黑象占比锁定、按 D1/D2/D3 填写 2-3/4-5/5-7 个中文短标签、3 秒读懂句、风险/避坑。不要只从段落标题提炼主题。
    4. 进入标准图生图时，Prompt 前 8 行先写尺度补偿锁：极远镜头、角色目标 1.5%-2.5%、主物品至少 6 倍高，以及按 D1/D2/D3 调整真实物品小现场大小与留白，“宁可扩展真实物品也不放大角色”。随后加入段落级 DENSITY CALIBRATION LOCK：先完整理解段落、标出段落类型和独立信息节点，再选择密度档位。D1 只用于单一判断（1 主 + 1 辅助、2-3 标签、2-3 节点）；D2 是解释型段落默认档（1 主 + 2-3 辅助、4-5 标签、3-4 节点）；D3 用于多步骤、多条件、多角色、对比、分支、反馈或 4+ 个不可合并节点（1 主/紧凑主组 + 3-5 辅助物件或状态单元、5-7 标签、4-6 节点）。每个节点必须由物件、状态、位置、动作、关系线或短标签承载；按段落选择流程、因果、对比、组成、层级、决策门或闭环中的一种关系，用一条主路径串联，D3 只允许一个分支或前后转折。最后写真实物品小现场、核心物理动作、对应档位的中文手写短标签、白色留白摄影棚与完整小黑象 2.0 IP lock。信息密度来自段落节点覆盖、关系和结果，不来自道具堆、长文字或卡片网格。解释型段落不得误用 D1；角色超 5% 时，按 `scale-calibration.md` 的 B/C 档改构图重生，不能只重复原 Prompt。
    5. Cover 模式必须额外读取并执行 `../wechat-tech-cover-image` 的封面原则。最终 prompt 必须完整填写：封面主题、主标题、1-2 个橙色标题重点词、底部金句、具体图解内容、真实主物品、小黑象核心动作、3 秒读懂句和 Allowed text 白名单。具体图解必须呈现“起点物件/困境 -> 小黑象用短象鼻执行动作 -> 结果/转折”，不能只画科技氛围底图。用户没给标题或金句时先生成，禁止把空变量传给图像模型。21:9 Cover 必须 one-pass integrated composition：背景、物件、小黑象、主标题、重点词、金句和必要标签由同一次 image_gen 生成。可先调用 `scripts/make_cover_typography_reference.py` 生成 ZCOOL KuaiLe 排版参考图并作为 image_gen 视觉参考，但禁止先出无字底图再本地叠字、贴标题卡或覆盖独立文字层。
       如果是 9:16 视频封面分支，改用 `references/prompt-template.md` 的 9:16 模板：顶部 0%-12% 与底部 84%-100% 保留平台 UI 安全区，标题放 14%-32%，平面内容隐喻放 34%-72%，金句放 75%-83%；重新设计竖向构图，不得裁切、拉伸或加黑边复用 21:9。若用户提供扇面参考图，改用其中的“9:16 扇面内容视觉分支”：平面画布承载主标题和主题色泼墨，必须出现 2-4 个批注气泡、2-4 个卡通简笔图标、1-2 个红色印章和且仅出现一个品牌锚点，默认小黑象，或用户提供的官方大象 logo；禁止实体折扇、扇片、扇骨、扇柄、手持和户外实拍背景。
       Cover 运行时必须执行 `cover-typography-runtime-contract.md`：排版参考图只能作为 `TYPOGRAPHY_REFERENCE_ONLY` 输入；一次 image_gen 后只保留最终图和 `cover-typography-receipt.md`，禁止 `title-overlay-zcool.png`、透明文字 PNG、`*-base.*`、`*text-layer*`、`*composite*`、`*merged*`。视觉 QA 返回 400/429/不可用时只能记 `BLOCKED`，不得发送候选图；交付前运行 `scripts/validate_cover_typography_contract.py`。
    6. 同文章多图不得一次全生：先让第 1 张通过 QA，把母版路径和模式尺度基准记入 `prompts/xiaohei-character-lock.md`；随后每张用同一母版单独生成、并排验收，过关后才继续。
    7. QA 不通过时不要交付候选图；优先减少道具、拉远镜头、重写腿部/象鼻锁定，再重生成。

    路由边界：
    - 用户说“小黑象 2.0 / 真实物品 / 真实物件 / 物理动作 / 小现场 / 场景图 / 彩蛋长卷”时，用本 Skill。
    - 用户只说“小黑象配图 / 白底手绘 / 正文插图”且没有 2.0 或真实物品要求时，改用 $xiaohei-elephant-illustrations。
    - 旧版 $xiaohei-scenes 只作为旧“小黑”源码参考，不承接“小黑象”请求。
policy:
  allow_implicit_invocation: true

required_references:
  - references/xiaohei-elephant-ip-lock.md
  - references/style-dna.md
  - references/prompt-template.md
  - references/fan-cover-reference-analysis.md
  - references/cover-typography-runtime-contract.md
  - references/object-patterns.md
  - references/qa-checklist.md
  - references/scale-calibration.md
  - references/article-batch-character-lock.md
  - templates/cover-typography-receipt.md
  - GOTCHAS.md

routing:
  accepts:
    - "小黑象 2.0"
    - "小黑象真实物品"
    - "小黑象真实物件"
    - "真实物品 + 物理动作"
    - "小黑象场景图"
    - "实物小现场"
    - "小黑象 2.0 cover"
    - "小黑象 2.0 9:16 视频封面"
    - "小黑象 2.0 竖版视频封面"
    - "扇面内容视频封面"
    - "扇面内容封面"
    - "折扇扇面视频封面（兼容旧触发词，默认只取扇面内容）"
    - "文稿确认后生成视频封面"
    - "小黑象彩蛋长卷"
  redirects:
    xiaohei-elephant-illustrations: "普通小黑象白底手绘解释图、1.0 正文插图"
    xiaohei-scenes: "旧版小黑源码参考；不承接小黑象请求"

quality_gate:
  critical_rejects:
    - "缺少短象鼻、小耳朵、白点眼或四足短圆桩腿"
    - "变成小黑人、旧小黑、黑色人形、火柴人或普通黑球"
    - "出现二足站姿、人形腿、火柴腿、膝盖、脚掌或鞋子"
    - "变成厚重 3D 玩具、写实象、萌宠、公仔、商品模型或近距离角色特写"
    - "小黑象占比过大：标准图超过 3%-5% 画面高、cover 超过 4%-6% 画面高，或黑色体量没有比此前测试缩小到约 1/3"
    - "同一文章同模式多图没有直接引用唯一角色母版，或尺度相对母版漂移超过 ±10%"
    - "后续图使用上一张成图作为新母版，导致串联漂移"
    - "标准真实物品模式没有真实物品或小黑象没有承担核心物理动作；扇面内容分支则没有平面画布上的清晰视觉关系"
    - "标准图只摘了主题名词，缺少段落的机制、结果或边界，无法看出输入 -> 机制 -> 结果关系"
    - "shot list 没有段落类型、独立信息节点、密度档位或节点视觉承载方式"
    - "解释型段落被固定压成 D1，或多步骤、多条件、多角色、对比、分支、反馈段落没有升级到 D2/D3"
    - "辅助物件没有对应段落信息职责，或画面有孤立物件排队、卡片网格、节点墙和复杂 PPT 信息图"
    - "真实物品太多、画面像商品摄影/PPT/复杂信息图/商业海报"
    - "cover 缺少主题、主标题、底部金句或具体图解内容，或只有抽象科技氛围底图"
    - "cover 采用先出无字底图再本地叠字、贴白色标题卡或覆盖独立文字层，而不是一体成型"
    - "cover 标题与背景、物件、小黑象的纹理、光影、透视和视觉动线脱节，像 PPT 文字压在照片上"
    - "cover 生成或引用 title-overlay-zcool.png、透明文字 PNG、*-base.*、*text-layer*、*composite* 或 *merged* 等独立文字/合成中间产物"
    - "cover 视觉 QA 返回 400、429、余额不足、超时、不可用或没有 cover-typography-receipt.md 回执，却仍把候选图当正式图发送"
    - "cover 标题字形漂移成标准科技黑体、几何尖角字、网页/UI 字体或白字发光；即使文字逐字正确也必须拒绝"
    - "9:16 视频封面没有顶部/底部平台 UI 安全区，或直接裁切、拉伸、加黑边复用 21:9 横版构图"
    - "扇面内容分支出现实体折扇、扇片、扇骨、扇柄、手持关系、折痕或户外实拍背景"
    - "扇面内容分支缺少平面画布、主标题、主题色泼墨、批注气泡、卡通简笔图标或红色印章，或复制参考图原有题字/印章"
    - "扇面内容分支缺少品牌锚点，或小黑象与官方大象 logo同时出现、漂浮、伪造或抢主视觉"
